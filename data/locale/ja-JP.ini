Dock.HowTo.Title="VST Ex Switcher の使い方"
Dock.HowTo.Text="<b>フィルタの ON/OFF をワンクリックで切り替え</b>ます。歌いながら A メロ &rarr; サビ などに。<ol><li>オーディオミキサーでソース (マイクなど) を右クリック &gt; <b>フィルタ (VST Ex)</b>。</li><li>A メロ用にフィルタを ON/OFF します。Sync Offset と音量も一緒に保存されます。</li><li><b>ON/OFF</b> &gt; <b>今の ON/OFF を新しいセットとして保存...</b> を押して、<i>Aメロ</i> などの名前を付けます。</li><li>サビ用にフィルタを切り替えて、<i>サビ</i> などのセットをもう 1 つ保存します。</li><li>セットがこのドックにボタンとして並びます。押すとすぐ切り替わります (読み込み直しがないので途切れません)。今の状態と一致するセットは緑になります。</li></ol><b>ホットキー:</b> OBS の設定 &gt; ホットキー &gt; そのソース &gt; <i>VST Ex: セット名</i>。<br><b>セットの上書き・削除:</b> フィルタ (VST Ex) &gt; ON/OFF。<br><b>&#8943; メニュー:</b> ソース名の表示 / 非表示、ソース名の代わりにメモを表示、<i>配置とメモを編集</i> でボタンの移動 (&#9664; &#9654;)、ソースの移動 (&#9650; &#9660;)、メモの入力。"
Dock.Memo.Tip="このソースのメモ。「ソース名の代わりにメモを表示」が ON のとき名前の代わりに出ます"
