Sync.Help="「開始」を押すと、カウント (タン・タン・タン・ウン) のあとに BPM120 のテスト曲が 16 拍流れます。すべてのキックにぴったり合わせて手拍子 (またはマイクを軽くたたく) してください。配信で使うヘッドホンかスピーカーで聞いてください。前後約 240 ms までのズレを測れます。いちばん正確なのは、デスクトップ音声をイヤホンで鳴らしてマイクにぴったり当てる方法で、手拍子は不要です。"
