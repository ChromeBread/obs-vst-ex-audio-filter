Dock.HowTo.Title="VST Ex Switcher : mode d'emploi"
Dock.HowTo.Text="<b>Basculez vos filtres en un clic</b>, p. ex. couplet &rarr; refrain pendant que vous chantez.<ol><li>Dans le mixeur audio, clic droit sur la source (p. ex. le micro) &gt; <b>Filtres (VST Ex)</b>.</li><li>Activez / désactivez les filtres pour le couplet. Le décalage de synchro et le volume sont aussi enregistrés.</li><li>Cliquez sur <b>ON/OFF</b> &gt; <b>Enregistrer l'état ON/OFF actuel comme nouvel ensemble...</b> et nommez-le, p. ex. <i>Couplet</i>.</li><li>Changez les filtres pour le refrain et enregistrez un autre ensemble, p. ex. <i>Refrain</i>.</li><li>Les ensembles apparaissent ici en boutons. Un clic bascule aussitôt (rien n'est rechargé, donc sans coupure). L'ensemble qui correspond à l'état actuel est vert.</li></ol><b>Raccourcis :</b> Paramètres OBS &gt; Raccourcis &gt; la source &gt; <i>VST Ex: &lt;ensemble&gt;</i>.<br><b>Écraser ou supprimer :</b> Filtres (VST Ex) &gt; ON/OFF.<br><b>Menu &#8943; :</b> afficher / masquer le nom des sources, afficher votre mémo à la place, et <i>Modifier la disposition et les mémos</i> pour déplacer les boutons (&#9664; &#9654;), les sources (&#9650; &#9660;) et saisir un mémo."
Dock.Memo.Tip="Mémo de cette source, affiché à la place de son nom quand cette option est active"
