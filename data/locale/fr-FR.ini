Sync.Help="Cliquez sur Démarrer. Après un décompte (trois clics et un silence), le morceau test BPM120 joue 16 temps : tapez des mains (ou sur le micro) exactement sur chaque kick. Utilisez le casque ou les enceintes du stream. Mesure les décalages jusqu'à environ 240 ms dans les deux sens. Le plus précis : jouer l'audio du bureau dans un écouteur collé au micro ; plus besoin de taper."
