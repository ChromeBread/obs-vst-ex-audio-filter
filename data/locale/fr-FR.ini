Sync.Help="Cliquez sur Démarrer. Le morceau joue 2 boucles de 8 temps : dans chaque boucle, écoutez les 4 premiers, puis tapez dans les mains (ou sur le micro) exactement sur les 4 dernières grosses caisses. Utilisez le casque ou les enceintes du stream. Mesure jusqu’à environ 240 ms dans les deux sens. Le plus précis : faites sortir l’audio du bureau dans une oreillette collée contre le micro ; inutile alors de taper."
