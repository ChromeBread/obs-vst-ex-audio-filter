Stereo.Name="VST Ex Pseudo-stéréo"
Stereo.Usage="Principe : le micro est mis en mono, la voix reste d’un côté et une copie retardée de quelques ms (un écho court) part de l’autre. L’oreille l’entend comme de la largeur, pas comme un écho. Commencez par 15 ms et 70 %. Au-delà d’environ 35 ms, on entend un écho. Tout est dans ce seul filtre : supprimez-le pour revenir en arrière. Placez-le après la suppression du bruit et les compresseurs, et ne mettez pas la source en mono."
