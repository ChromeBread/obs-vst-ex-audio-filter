Dock.HowTo.Title="VST Ex Switcher: how to use"
Dock.HowTo.Text="<b>Switch your filters in one click</b>, e.g. verse &rarr; chorus while you sing.<ol><li>In the Audio Mixer, right-click the source (e.g. your mic) &gt; <b>Filters (VST Ex)</b>.</li><li>Turn the filters ON/OFF the way you want for the verse. The sync offset and volume are saved too.</li><li>Click <b>ON/OFF</b> &gt; <b>Save current ON/OFF as new set...</b> and name it, e.g. <i>Verse</i>.</li><li>Change the filters for the chorus and save another set, e.g. <i>Chorus</i>.</li><li>The sets appear here as buttons. Click one to switch at once (nothing is reloaded, so there is no gap). The set that matches now is green.</li></ol><b>Hotkeys:</b> OBS Settings &gt; Hotkeys &gt; the source &gt; <i>VST Ex: &lt;set&gt;</i>.<br><b>Overwrite or delete a set:</b> Filters (VST Ex) &gt; ON/OFF.<br><b>&#8943; menu:</b> show or hide source names, show your memo instead of the name, and <i>Edit layout and memos</i> to move buttons (&#9664; &#9654;), move sources (&#9650; &#9660;) and type a memo."
