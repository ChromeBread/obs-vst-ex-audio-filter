Stereo.Name="VST Ex Pseudo Stereo"
Stereo.Usage="How it works: the mic is mixed to mono, the voice stays on one side and a short delayed copy (an echo of a few ms) goes to the other side. Your ear hears that as width, not as an echo. Start with 15 ms and 70 %. Above about 35 ms it starts to sound like a slapback echo. Everything is in this one filter: delete it to undo. Put it after noise suppression and compressors, and keep the source in stereo (not Downmix to Mono)."
