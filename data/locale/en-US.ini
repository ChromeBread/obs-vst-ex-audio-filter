Pitch.Semitones="Semitones"
Pitch.Semitones.Tip="Moves the sound up or down by whole semitones (12 = one octave). 0 leaves the audio untouched. Adds about 20 ms of delay while shifting."
Pitch.Pan="Pan (L - R)"
Pitch.Pan.Tip="-100 = left only, 0 = center (unchanged), 100 = right only. Works on stereo sources."
Pitch.Usage="When you line up the timing of several devices, change the pitch (the slider moves in semitones) so you can tell the devices apart, and use Pan so each device reaches a different ear."
