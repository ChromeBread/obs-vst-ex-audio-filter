Stereo.Width="Width"
Stereo.Side="Delayed copy goes"
Stereo.Side.Right="to the right (voice sits left)"
Stereo.Side.Left="to the left (voice sits right)"
Chain.Imager="Imager"
Chain.Imager.Tip="Half-circle stereo image after each row. Up = mono/centre, toward L or R = panned, flat along the bottom = wide or out of phase. Reads audio only while ticked."
