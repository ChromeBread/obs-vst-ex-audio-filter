Sync.Help="Tekan Mulai. Setelah hitungan (tiga ketukan dan jeda) lagu tes BPM120 diputar 16 ketukan: tepuk tangan (atau ketuk mic) tepat di setiap kick. Pakai headphone atau speaker yang dipakai saat siaran. Mengukur selisih sampai sekitar 240 ms ke dua arah. Paling tepat: putar desktop audio lewat earphone dan tempelkan ke mic; tidak perlu tepuk tangan."
