Dock.HowTo.Title="Cara pakai VST Ex Switcher"
Dock.HowTo.Text="<b>Ganti ON/OFF filter dengan satu klik</b>, mis. verse &rarr; chorus saat bernyanyi.<ol><li>Di Audio Mixer, klik kanan sumber (mis. mic) &gt; <b>Filter (VST Ex)</b>.</li><li>Nyalakan/matikan filter untuk verse. Sync offset dan volume ikut disimpan.</li><li>Klik <b>ON/OFF</b> &gt; <b>Simpan ON/OFF saat ini sebagai set baru...</b> dan beri nama, mis. <i>Verse</i>.</li><li>Ubah filter untuk chorus dan simpan set lain, mis. <i>Chorus</i>.</li><li>Set muncul di sini sebagai tombol. Klik untuk langsung berganti (tidak dimuat ulang, jadi tanpa jeda). Set yang cocok dengan keadaan sekarang berwarna hijau.</li></ol><b>Hotkey:</b> Pengaturan OBS &gt; Hotkey &gt; sumber itu &gt; <i>VST Ex: &lt;set&gt;</i>.<br><b>Timpa atau hapus set:</b> Filter (VST Ex) &gt; ON/OFF.<br><b>Menu &#8943;:</b> tampilkan / sembunyikan nama sumber, tampilkan memo sebagai ganti nama, dan <i>Edit tata letak dan memo</i> untuk memindah tombol (&#9664; &#9654;), memindah sumber (&#9650; &#9660;), dan mengetik memo."
