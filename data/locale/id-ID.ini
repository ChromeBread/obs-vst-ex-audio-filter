Master.Status.Ok.Tip="Stream melewati master."
Master.Status.Failed="Stream memakai suara normal"
Master.Status.Failed.Tip="Stream ini tidak bisa melewati master, jadi memakai suara normal OBS. Ini terjadi dengan Enhanced Broadcasting, atau saat rekaman yang berjalan berbagi encoder audio stream."
Master.Unlock.Cautions="<b>Fitur percobaan: baca sebelum memakai.</b><ul><li>Detail perilakunya belum diverifikasi. Suara stream bisa berhenti, terputus, atau bergeser dari video.</li><li>Selalu periksa dengan stream uji privat sebelum stream sungguhan.</li><li>Hanya berlaku untuk stream, bukan rekaman.</li><li>Pembaruan OBS bisa membuatnya berhenti bekerja.</li><li>Plugin berat pada master dapat mengganggu seluruh audio OBS.</li></ul>"
