Master.In="Trek masukan"
Master.HowTo.Text="<b>Centang Aktifkan master: stream berikutnya akan melewatinya.</b><br>Master mengambil campuran <b>trek masukan</b> lalu menerapkan volume dan filter VST. Hasilnya masuk ke trek virtual yang hanya dipakai stream.<ul><li>Trek 1 sampai 6 OBS, pengaturan keluaran, dan rekaman tidak berubah.</li><li>Tidak ada yang disimpan di pengaturan OBS: setelah crash, atau tanpa VST Ex, OBS langsung menyiarkan suara normalnya.</li><li>Jika stream tidak bisa melewati master, stream dimulai dengan suara normal dan peringatan muncul di sini.</li><li>Pengaktifan berlaku pada awal stream berikutnya. Selama stream, pengaturan dikunci.</li></ul><b>Waktu:</b> master tetap sinkron dengan video; hanya latensi pluginnya yang bertambah.<br><b>Filter:</b> menu ini atau VST Ex Mixer."
