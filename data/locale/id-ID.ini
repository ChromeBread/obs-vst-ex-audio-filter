Stereo.Name="VST Ex Pseudo Stereo"
Stereo.Usage="Cara kerja: mik digabung menjadi mono, suara tetap di satu sisi dan salinan yang ditunda beberapa ms (gema pendek) masuk ke sisi lain. Telinga mendengarnya sebagai lebar, bukan gema. Mulai dari 15 ms dan 70 %. Di atas sekitar 35 ms mulai terdengar seperti gema. Semua ada di satu filter ini: hapus untuk mengembalikan. Letakkan setelah peredam derau dan kompresor, dan jangan aktifkan Downmix ke Mono pada sumber."
