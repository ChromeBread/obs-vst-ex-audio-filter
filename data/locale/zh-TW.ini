Stereo.Name="VST Ex 假立體聲"
Stereo.Usage="原理: 先把麥克風混成單聲道，人聲留在一側，延遲幾 ms 的複本 (短回音) 放到另一側。耳朵聽起來是變寬，而不是回音。先從 15 ms、70 % 開始。超過約 35 ms 會開始聽起來像回音。全部都在這一個濾鏡裡完成，刪掉就能恢復原狀。請放在降噪與壓縮器之後，且不要把來源設為降混為單聲道。"
