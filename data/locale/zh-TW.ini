Dock.HowTo="使用方法..."
Dock.HowTo.Title="VST Ex Switcher 使用方法"
Dock.HowTo.Text="<b>一鍵切換濾鏡的 ON/OFF</b>，例如唱歌時主歌 &rarr; 副歌。<ol><li>在音訊混音器對來源 (例如麥克風) 按右鍵 &gt; <b>濾鏡 (VST Ex)</b>。</li><li>依主歌需要把濾鏡設為 ON/OFF。同步偏移與音量也會一起儲存。</li><li>按 <b>ON/OFF</b> &gt; <b>將目前的 ON/OFF 儲存為新組合...</b>，取名例如 <i>主歌</i>。</li><li>為副歌切換濾鏡，再儲存一組例如 <i>副歌</i>。</li><li>組合會以按鈕出現在此停駐視窗。按一下立即切換 (不重新載入，不會中斷)。與目前狀態相符的組合會顯示綠色。</li></ol><b>快速鍵:</b> OBS 設定 &gt; 快速鍵 &gt; 該來源 &gt; <i>VST Ex: 組合名稱</i>。<br><b>覆寫或刪除組合:</b> 濾鏡 (VST Ex) &gt; ON/OFF。<br><b>&#8943; 選單:</b> 顯示 / 隱藏來源名稱、以備註取代名稱，以及 <i>編輯排列與備註</i>: 移動按鈕 (&#9664; &#9654;)、移動來源 (&#9650; &#9660;)、輸入備註。"
