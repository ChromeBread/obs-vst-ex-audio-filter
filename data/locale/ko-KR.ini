Stereo.Usage="원리: 마이크를 모노로 합친 뒤, 목소리는 한쪽에 그대로 두고 몇 ms 늦춘 복사본(짧은 에코)을 반대쪽에 냅니다. 귀에는 에코가 아니라 넓어진 소리로 들립니다. 15 ms, 70 %부터 시작하세요. 35 ms를 넘으면 메아리처럼 들리기 시작합니다. 모두 이 필터 하나에서 처리하므로 삭제하면 원래대로 돌아갑니다. 노이즈 억제와 컴프레서 뒤에 두고, 소스를 모노 다운믹스로 하지 마세요."
Stereo.Delay="복사본 지연"
Stereo.Width="넓이"
Stereo.Side="늦춘 복사본 방향"
Stereo.Side.Right="오른쪽 (목소리는 왼쪽)"
Stereo.Side.Left="왼쪽 (목소리는 오른쪽)"
Chain.Imager="이미저"
Chain.Imager.Tip="각 행 끝에 반원형 스테레오 이미지를 표시합니다. 위 = 모노/가운데, L·R 쪽 = 좌우로 치우친 소리, 밑변을 따라 = 너무 넓음/역상. 체크한 동안만 오디오를 읽습니다."
Chain.ImagerRight="오른쪽 끝에 표시"
FxDock.Hint="클릭: ON/OFF   우클릭: 플러그인 열기"
FxDock.Empty="아직 VST 필터가 없습니다. 소스에 VST를 추가하면 (필터 (VST Ex) > + 추가) 여기에 버튼이 나타납니다."
FxDock.Follow="따라가기"
FxDock.Follow.Tip="오디오 믹서를 따라감: 각 열을 해당 소스의 레벨 미터 바로 아래에 같은 폭으로 둡니다. OFF: 일반 열."
FxDock.Reserve="빈 공간 유지"
FxDock.Reserve.Tip="VST가 없는 오디오 소스 자리도 비워 두어 열을 미터 아래에 맞춥니다. OFF: VST가 있는 열만 붙여서 나열."
