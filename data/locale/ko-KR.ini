Dock.HowTo.Title="VST Ex Switcher 사용법"
Dock.HowTo.Text="<b>필터 ON/OFF를 한 번의 클릭으로 전환</b>합니다. 노래 중 벌스 &rarr; 후렴 등에.<ol><li>오디오 믹서에서 소스 (마이크 등)를 우클릭 &gt; <b>필터 (VST Ex)</b>.</li><li>벌스용으로 필터를 ON/OFF합니다. 싱크 오프셋과 음량도 함께 저장됩니다.</li><li><b>ON/OFF</b> &gt; <b>현재 ON/OFF를 새 세트로 저장...</b>을 누르고 <i>벌스</i> 같은 이름을 붙입니다.</li><li>후렴용으로 필터를 바꾸고 <i>후렴</i> 같은 세트를 하나 더 저장합니다.</li><li>세트가 이 도크에 버튼으로 나타납니다. 누르면 바로 전환됩니다 (다시 불러오지 않아 끊김이 없음). 지금 상태와 같은 세트는 초록색입니다.</li></ol><b>단축키:</b> OBS 설정 &gt; 단축키 &gt; 해당 소스 &gt; <i>VST Ex: 세트 이름</i>.<br><b>세트 덮어쓰기 / 삭제:</b> 필터 (VST Ex) &gt; ON/OFF.<br><b>&#8943; 메뉴:</b> 소스 이름 표시 / 숨기기, 이름 대신 메모 표시, <i>배치와 메모 편집</i>으로 버튼 이동 (&#9664; &#9654;), 소스 이동 (&#9650; &#9660;), 메모 입력."
