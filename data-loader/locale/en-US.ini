Handover="Hand over"
Handover.Help="Moves VST filters between VST Enigmax Loader and the other VST hosts, so they are not lost when VST Enigmax Loader is removed (or so you can bring them in). VST2 goes to and from OBS's own \"VST 2.x Plug-in\" filter, VST3 to and from atkAudio PluginHost. Each filter is replaced in place: same source, position, name and ON/OFF. Tip: export the scene collection first."
